<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#11182a"><title>The Midnight Library · Flipbook</title>
<style>

</style></head><body>
<header><div><div class="eyebrow">Your reading room</div><h1 class="title">The Midnight Library</h1><div class="byline">Matt Haig</div></div><div class="tools"><button id="contents" aria-label="Contents and bookmarks">Contents</button><button id="zoom">Zoom +</button><select id="layout" aria-label="Page layout"><option value="auto">Auto layout</option><option value="single">Single page</option><option value="spread">Two pages</option></select><button id="full" aria-label="Toggle fullscreen">⛶</button></div></header>

<footer class="footer"><input class="progress" id="progress" type="range" min="1" max="276" value="1" aria-label="Reading progress"><div class="status"><div class="jump"><button id="back" aria-label="Previous page">‹</button><label for="pageNumber">Page</label><input id="pageNumber" type="number" min="1" max="276" value="1"><span id="total">of 276</span><button id="forward" aria-label="Next page">›</button></div><span id="percent">0%</span><button id="bookmark" aria-label="Bookmark this page">☆ Save</button></div><p class="hint">Swipe or use ← → to turn pages · Zoom to read closer · Your place is saved on this device</p></footer>

<script>
const PAGE_COUNT=276;
const CHAPTERS=[["Cover", 1], ["Contents", 9], ["A Conversation About Rain", 12], ["Nineteen Years Later", 14], ["The Man at the Door", 15], ["String Theory", 18], ["To Live Is to Suffer", 22], ["Doors", 23], ["How to Be a Black Hole", 27], ["Antimatter", 29], ["00:00:00", 33], ["The Librarian", 36], ["The Midnight Library", 38], ["The Moving Shelves", 40], ["The Book of Regrets", 43], ["Regret Overload", 45], ["Every Life Begins Now", 47], ["The Three Horseshoes", 50], ["The Penultimate Update Nora Had Posted Before She Found Herself Between Life and Death", 65], ["The Chessboard", 66], ["The Only Way to Learn Is to Live", 69], ["Fire", 75], ["Fish Tank", 85], ["The Last Update That Nora Had Posted Before She Found Herself Between Life and Death", 90], ["The Successful Life", 91], ["Peppermint Tea", 101], ["The Tree That Is Our Life", 107], ["System Error", 112], ["Svalbard", 116], ["Hugo Lef\u00e8vre", 119], ["Walking in Circles", 122], ["A Moment of Extreme Crisis in the Middle of Nowhere", 127], ["The Frustration of Not Finding a Library When You Really Need One", 128], ["Island", 130], ["Permafrost", 131], ["One Night in Longyearbyen", 134], ["Expectation", 138], ["Life and Death and the Quantum Wave Function", 139], ["If Something Is Happening to Me, I Want to Be There", 147], ["God and Other Librarians", 148], ["Fame", 151], ["Milky Way", 154], ["Wild and Free", 155], ["Ryan Bailey", 160], ["A Silver Tray of Honey Cakes", 165], ["The Podcast of Revelations", 169], ["\u2018Howl\u2019", 174], ["Love and Pain", 177], ["Equidistance", 181], ["Someone Else\u2019s Dream", 182], ["A Gentle Life", 186], ["Why Want Another Universe If This One Has Dogs?", 190], ["Dinner with Dylan", 193], ["Last Chance Saloon", 195], ["Buena Vista Vineyard", 197], ["The Many Lives of Nora Seed", 200], ["Lost in the Library", 205], ["A Pearl in the Shell", 209], ["The Game", 214], ["The Perfect Life", 219], ["A Spiritual Quest for a Deeper Connection with the Universe", 223], ["Hammersmith", 229], ["Tricycle", 232], ["No Longer Here", 235], ["An Incident With the Police", 238], ["A New Way of Seeing", 242], ["The Flowers Have Water", 244], ["Nowhere to Land", 246], ["Don\u2019t You Dare Give Up, Nora Seed!", 251], ["Awakening", 255], ["The Other Side of Despair", 258], ["A Thing I Have Learned", 260], ["Living Versus Understanding", 261], ["The Volcano", 266], ["How It Ends", 269]];
const $=id=>document.getElementById(id),store={get(k,d){try{return JSON.parse(localStorage.getItem('midnight-'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('midnight-'+k,JSON.stringify(v))}catch{}}};
const clamp=n=>Math.max(1,Math.min(PAGE_COUNT,Math.round(Number(n)||1)));
let page=clamp(Number(location.hash.slice(1))||store.get('page',1)),busy=false,pending=null,turningTo=null,zoomPage=page,zoomScale=1.7,marks=store.get('marks',[]),layout=store.get('layout','auto');
if(!Array.isArray(marks))marks=[];
if(!['auto','single','spread'].includes(layout))layout='auto';
$('layout').value=layout;
const src=n=>typeof EMBEDDED!=='undefined'?EMBEDDED[n-1]:'pages/'+String(n).padStart(3,'0')+'.webp';
const spread=()=>layout==='spread'&&innerWidth>700||layout==='auto'&&innerWidth>900;
const countFor=n=>spread()&&n>1&&n<PAGE_COUNT?2:1;
const count=()=>countFor(page);
function imageFor(n){const img=new Image();img.className='page';img.dataset.page=n;img.src=src(n);img.alt='The Midnight Library, PDF page '+n;img.draggable=false;return img}
function dimensions(){const stage=$('stage'),c=count(),h=Math.max(24,Math.min(stage.clientHeight-(innerWidth>700?44:24),(stage.clientWidth-(innerWidth>700?176:16))/c*792/612));$('book').style.height=h+'px';$('book').style.width=h*612/792*c+'px'}
function sync(){store.set('page',page);try{history.replaceState(null,'','#'+page)}catch{}$('pageNumber').value=page;$('progress').value=page;$('total').textContent=(count()===2?'– '+(page+1)+' ':'')+'of '+PAGE_COUNT;$('percent').textContent=Math.round((page-1)/(PAGE_COUNT-1)*100)+'%';for(const id of ['prev','back'])$(id).disabled=page===1;for(const id of ['next','forward'])$(id).disabled=page+count()>PAGE_COUNT;$('bookmark').textContent=marks.includes(page)?'★ Saved':'☆ Save'}
function showError(){const notice=$('notice');notice.replaceChildren(document.createTextNode('This page could not load. Check your connection and try again.'));const b=document.createElement('button');b.textContent='Retry';b.onclick=()=>{notice.classList.remove('visible');render()};notice.append(b);notice.classList.add('visible')}
function render(){const book=$('book');book.replaceChildren();for(let n=page;n<page+count();n++){const s=document.createElement('div');s.className='sheet';const img=imageFor(n);img.onerror=showError;s.append(img);book.append(s)}dimensions();sync();for(let n=Math.max(1,page-2);n<=Math.min(PAGE_COUNT,page+3);n++){const i=new Image();i.src=src(n)}}
const imageCache=new Map();
function preload(n){if(!imageCache.has(n)){const promise=new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src=src(n)});imageCache.set(n,promise);promise.catch(()=>imageCache.delete(n))}return imageCache.get(n)}
async function go(target,animate=true){target=clamp(target);if(busy){pending={target,animate};return}if(target===page){sync();return}busy=true;turningTo=target;let overlay;
try{await Promise.all(Array.from({length:countFor(target)},(_,i)=>preload(target+i)));$('notice').classList.remove('visible');const old=page,oldCount=count(),forward=target>old,book=$('book');
if(animate&&typeof book.animate==='function'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){overlay=document.createElement('div');overlay.className='turn '+(forward?'next':'prev');overlay.style.width=100/oldCount+'%';overlay.append(imageFor(forward?old+oldCount-1:old));book.append(overlay);await overlay.animate([{transform:'rotateY(0deg)',filter:'brightness(1)'},{transform:'rotateY('+(forward?'-88':'88')+'deg)',filter:'brightness(.6)'}],{duration:180,easing:'ease-in',fill:'forwards'}).finished.catch(()=>{})}
page=target;render();if(overlay){const fresh=document.createElement('div');fresh.className='turn '+(forward?'next':'prev');fresh.style.width=100/count()+'%';fresh.append(imageFor(forward?page+count()-1:page));book.append(fresh);await fresh.animate([{transform:'rotateY('+(forward?'88':'-88')+'deg)'},{transform:'rotateY(0deg)'}],{duration:160,easing:'ease-out'}).finished.catch(()=>{});fresh.remove()}
}catch{overlay?.remove();showError();sync()}finally{busy=false;turningTo=null;const queued=pending;pending=null;if(queued)go(queued.target,queued.animate)}}
const basePage=()=>pending?.target??turningTo??page;
const next=()=>{const n=basePage();go(n+countFor(n))},prev=()=>{const n=basePage();go(n===2?1:n-(spread()?2:1))};
for(const id of ['next','forward'])$(id).onclick=next;for(const id of ['prev','back'])$(id).onclick=prev;
$('pageNumber').onchange=e=>go(e.target.value,false);$('pageNumber').onkeydown=e=>{if(e.key==='Enter'){go(e.target.value,false);e.target.blur()}};$('progress').oninput=e=>go(e.target.value,false);$('layout').onchange=e=>{layout=e.target.value;store.set('layout',layout);render()};
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{render();if($('zoomView').classList.contains('open'))sizeZoom()},100)});addEventListener('hashchange',()=>go(location.hash.slice(1),false));addEventListener('keydown',e=>{if($('toc').open)return;if(e.key==='Escape'){closeZoom();return}if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if($('zoomView').classList.contains('open')){if(e.key==='ArrowRight'){e.preventDefault();setZoomPage(zoomPage+1)}if(e.key==='ArrowLeft'){e.preventDefault();setZoomPage(zoomPage-1)}return}if(e.key==='ArrowRight'){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}});
let start=null,suppressClickUntil=0;const book=$('book');book.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;start={x:e.clientX,y:e.clientY,id:e.pointerId};book.setPointerCapture?.(e.pointerId)});book.addEventListener('pointercancel',()=>start=null);book.addEventListener('pointerup',e=>{if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){suppressClickUntil=Date.now()+400;dx<0?next():prev()}});
book.ondblclick=e=>openZoom(Number(e.target.dataset.page)||page);
book.onclick=e=>{if(Date.now()<suppressClickUntil||e.detail>1)return;const rect=book.getBoundingClientRect(),fraction=(e.clientX-rect.left)/rect.width;if(fraction>.82)next();else if(fraction<.18)prev()};
$('bookmark').onclick=()=>{marks=marks.includes(page)?marks.filter(n=>n!==page):[...marks,page].sort((a,b)=>a-b);store.set('marks',marks);sync()};
function chapterButton(label,n,parent){const b=document.createElement('button');b.className='chapter';b.textContent=label+' · '+n;b.onclick=()=>{$('toc').close();go(n,false)};parent.append(b)}
$('contents').onclick=()=>{$('saved').replaceChildren();if(marks.length){const h=document.createElement('h3');h.textContent='Bookmarks';$('saved').append(h);marks.forEach(n=>chapterButton('Saved page',n,$('saved')))}$('toc').showModal()};$('closeToc').onclick=()=>$('toc').close();
(typeof CHAPTERS!=='undefined'?CHAPTERS:[['Cover',1],['Contents',9],['A Conversation About Rain',12]]).forEach(([label,n])=>chapterButton(label,n,$('chapters')));
function sizeZoom(){$('zoomImg').style.width=Math.min(innerWidth,820)*zoomScale+'px'}
function setZoomPage(n){zoomPage=clamp(n);$('zoomImg').src=src(zoomPage);$('zoomImg').alt='Book page '+zoomPage;$('zoomLabel').textContent=zoomPage+' / '+PAGE_COUNT;$('zoomPrev').disabled=zoomPage===1;$('zoomNext').disabled=zoomPage===PAGE_COUNT;sizeZoom();$('zoomScroll').scrollTo(0,0)}
function openZoom(n){$('zoomView').classList.add('open');for(const el of document.querySelectorAll('header,main,footer'))el.inert=true;setZoomPage(n);$('zoomClose').focus()}
function closeZoom(){if(!$('zoomView').classList.contains('open'))return;$('zoomView').classList.remove('open');for(const el of document.querySelectorAll('header,main,footer'))el.inert=false;go(zoomPage,false);$('zoom').focus()}
$('zoom').onclick=()=>openZoom(page);$('zoomClose').onclick=closeZoom;$('zoomPrev').onclick=()=>setZoomPage(zoomPage-1);$('zoomNext').onclick=()=>setZoomPage(zoomPage+1);$('larger').onclick=()=>{zoomScale=Math.min(4,zoomScale+.3);sizeZoom()};$('smaller').onclick=()=>{zoomScale=Math.max(1,zoomScale-.3);sizeZoom()};
$('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{$('full').textContent='Unavailable';setTimeout(()=>$('full').textContent='⛶',2000)}};
render();
</script></body></html>
