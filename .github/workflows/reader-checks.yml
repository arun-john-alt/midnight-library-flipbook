name: Reader regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check reading, gestures, pagination and offline behavior
        run: node --test tests/*.test.cjs
